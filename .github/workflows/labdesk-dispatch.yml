name: Manual build with artifact upload

# This repository holds no signing secrets, so the Android, macOS and Windows
# signing steps in flutter-build.yml skip themselves and the artifacts come out
# unsigned. Add ANDROID_SIGNING_KEY, MACOS_P12_BASE64 or SIGN_BASE_URL to turn
# the matching steps back on.

on:
  workflow_dispatch:
    inputs:
      upload-tag:
        description: "Tag name used for artifact naming"
        type: string
        required: false
        default: "manual"

permissions:
  contents: write

# One build at a time. Two dispatches overlapped on 2026-09-04 and every publish
# step of the older run failed with "Resource not accessible by integration"
# once the newer one started, leaving a release with one asset.
concurrency:
  group: labdesk-dispatch
  cancel-in-progress: false

jobs:
  run:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: true
      upload-tag: ${{ inputs.upload-tag }}
    secrets: inherit
