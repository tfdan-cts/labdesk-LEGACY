name: CI

env:
#   MIN_SUPPORTED_RUST_VERSION: "1.46.0"
#   CICD_INTERMEDIATES_DIR: "_cicd-intermediates"
  # vcpkg binary caching: the 'x-gha' backend was removed from vcpkg, so the old
  # "clear;x-gha,readwrite" expression was rejected at runtime and every port rebuilt from
  # source on every run. Use vcpkg's files provider pointed at a directory that actions/cache
  # saves and restores per job (see the "Cache vcpkg binary packages" steps). The triplet is
  # part of every cache key so one platform's archives can never restore into another
  # platform's job.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
  # for multiarch gcc compatibility
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
