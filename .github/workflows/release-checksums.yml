name: Verify release signatures

# Signing occurs offline. This workflow cannot sign or overwrite release assets.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release-checksums.yml
      - scripts/release_verify.py
      - scripts/test_release_verify.py
      - res/release-signing-public-key

permissions:
  contents: read

jobs:
  verifier-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==49.0.0
      - run: python3 scripts/test_release_verify.py

  verify-release:
    if: github.event_name != 'pull_request'
    needs: verifier-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check cryptography==49.0.0
      - name: Download the published inventory
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
      - name: Verify the pinned signature and every asset
        run: python3 scripts/release_verify.py --public-key res/release-signing-public-key release-assets
