# The iOS verification job. There is no Mac in this fleet, so a booted
# simulator on a GitHub Actions macOS runner is the device: this workflow builds
# the app for the simulator, installs it, launches it, and uploads screenshots
# and logs. Reading code is not verification and a green build is not a working
# screen; the screenshot is the evidence.
#
# Why x86_64 on an Intel runner rather than arm64 on the default one.
#
# The obvious route is aarch64-apple-ios-sim on macos-latest, and it was tried
# first, across four runs. Four separate dependencies do not know that target:
# libsodium-sys panics with "Unknown iOS build target", bindgen hands the triple
# to clang which rejects the -sim spelling outright, magnum-opus resolves the
# vcpkg triplet to the device one and cannot find opus headers, and vcpkg-rs
# does the same. Each has an environment-variable escape hatch, and stacking
# them still fails: SODIUM_LIB_DIR and BINDGEN_EXTRA_CLANG_ARGS are global,
# while a single "cargo build --target" also compiles build scripts for the
# host, so the simulator's libsodium was linked into a macOS build script and
# ld refused it. Scoping an environment variable to the target and not the host
# needs an unstable cargo flag.
#
# x86_64-apple-ios is the older, well travelled simulator target. Every one of
# those dependencies already knows it, vcpkg-rs maps it to the built-in x64-ios
# triplet, and clang accepts it. It needs an Intel runner, which is the whole
# cost. The repository already ships this exact build as flutter/ios_x64.sh.
#
# The four workarounds are gone rather than accumulated. That is the point.
name: iOS simulator verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/ios
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "**/*.md"

permissions:
  contents: read

# One at a time per branch. A superseded push has nothing to prove.
concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.24.5"
  RUST_VERSION: "1.75"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  # The files backend, not x-gha: vcpkg removed x-gha, and the value the rest of
  # the repository carried cached nothing while printing a warning. Measured on
  # the shared workflows at 390 seconds cold against 3 seconds warm.
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
  VCPKG_TRIPLET: "x64-ios"
  RUST_TARGET: "x86_64-apple-ios"

jobs:
  # The same bridge the release build uses, rather than a second copy of the
  # codegen that could drift from it.
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  simulator:
    name: build and run on a simulator
    needs: [generate-bridge]
    # Intel, for the reason at the top of this file.
    runs-on: macos-15-intel
    # The cap exists so a stuck job says so rather than holding a macOS runner
    # for the six hours GitHub allows.
    timeout-minutes: 90
    steps:
      # There is deliberately no step exporting ACTIONS_CACHE_URL and
      # ACTIONS_RUNTIME_TOKEN here. Those fed vcpkg's x-gha backend, which no
      # longer exists; actions/cache does not read them.
      #
      # nasm and yasm are what the ffmpeg and aom ports want. The autotools are
      # what any port going through vcpkg_configure_make wants, and the ports do
      # not install them for themselves; a job's package list has to satisfy the
      # union of what every port it builds needs.
      - name: Install dependencies
        run: brew install nasm yasm autoconf automake libtool

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      # Restore and save are split rather than using actions/cache whole,
      # because this workflow cancels superseded runs and actions/cache only
      # saves in its post step on success. A cancelled run would never populate
      # the cache, which is the run this job has most often.
      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT_ID }}-
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-

      # run-vcpkg's own cache covers the vcpkg tool and repository, not the
      # built packages. Its log group says so outright, which is the sentence
      # that would otherwise make a reader think the packages were cached.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Save the vcpkg binary cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json') }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.RUST_TARGET }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-ios-sim
          key: ${{ env.RUST_TARGET }}

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      # No hwcodec, and no environment overrides: this is exactly the command
      # flutter/ios_x64.sh already carries, which is why nothing here needs
      # persuading about the target.
      - name: Build the rust lib for the simulator
        run: |
          rustup target add ${{ env.RUST_TARGET }}
          cargo build --locked --features flutter --release --target ${{ env.RUST_TARGET }} --lib

      # Runner.xcodeproj links a literal path under target/aarch64-apple-ios,
      # the device slice. Rather than fork the project file for a job that never
      # ships a build, the simulator slice is put where the project already
      # looks. The device build in flutter-build.yml is untouched by this.
      - name: Put the simulator slice where the Xcode project looks for it
        run: |
          mkdir -p target/aarch64-apple-ios/release
          cp target/${{ env.RUST_TARGET }}/release/liblibrustdesk.a \
            target/aarch64-apple-ios/release/liblibrustdesk.a
          lipo -info target/aarch64-apple-ios/release/liblibrustdesk.a

      - name: Build the app for the simulator
        run: |
          cd flutter
          flutter pub get
          flutter build ios --simulator --debug

      - name: Boot a simulator
        id: sim
        timeout-minutes: 8
        run: |
          xcrun simctl list runtimes
          # The newest iPhone this runner offers, resolved rather than pinned,
          # because the Intel image carries a different Xcode from the arm64 one
          # and a hardcoded device type is the kind of thing that rots quietly.
          device_type=$(xcrun simctl list devicetypes \
            | grep -o 'com.apple.CoreSimulator.SimDeviceType.iPhone-[0-9A-Za-z-]*' \
            | tail -1)
          echo "device type: $device_type"
          udid=$(xcrun simctl create labdesk-verify "$device_type")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The bundle identifier is read out of the built app rather than written
      # here, so this step keeps working through any rename.
      - name: Install and launch
        id: launch
        run: |
          app=flutter/build/ios/iphonesimulator/Runner.app
          bundle_id=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$app/Info.plist")
          echo "bundle identifier: $bundle_id"
          echo "display name: $(/usr/libexec/PlistBuddy -c "Print CFBundleDisplayName" "$app/Info.plist" || echo none)"
          echo "bundle_id=$bundle_id" >> "$GITHUB_OUTPUT"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$bundle_id"

      - name: Screenshots
        if: always()
        run: |
          mkdir -p artifacts
          for seconds in 3 7 10; do
            sleep "$seconds"
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot \
              "artifacts/after-${seconds}s.png" || true
          done

      # Tier 1 asks for dark mode that follows the system. The application asks
      # for ThemeMode.system by default and listens for the platform brightness
      # changing, so flipping the simulator is the check: two screenshots that
      # differ are the evidence, and two that do not are the bug.
      - name: Both appearances
        if: always()
        run: |
          for appearance in dark light; do
            xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance \
              "$appearance" || true
            sleep 4
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot \
              "artifacts/appearance-${appearance}.png" || true
          done

      # A launch that returns a pid and then dies is not a running app, so this
      # is the check the job actually passes or fails on.
      - name: The app is still running
        run: |
          state=$(xcrun simctl spawn "${{ steps.sim.outputs.udid }}" \
            launchctl list | grep "${{ steps.launch.outputs.bundle_id }}" || true)
          echo "launchctl says: ${state:-nothing}"
          if [ -z "$state" ]; then
            echo "the app is not running after the screenshot sequence" >&2
            exit 1
          fi

      # The rebrand is only real if iOS renders it. Sending the app to the
      # background leaves the home screen up, where the icon and the display
      # name are the two things an operator sees before anything else.
      - name: The home screen, for the icon and the name
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light || true
          xcrun simctl terminate "${{ steps.sim.outputs.udid }}" \
            "${{ steps.launch.outputs.bundle_id }}" || true
          sleep 4
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot \
            "artifacts/home-screen.png" || true

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show \
            --style compact --last 5m \
            --predicate 'processImagePath CONTAINS "Runner"' \
            > artifacts/app.log 2>&1 || true
          tail -n 60 artifacts/app.log || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-simulator-evidence
          path: artifacts/
          if-no-files-found: warn

      - name: Upload the app
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: labdesk-ios-simulator-app
          path: flutter/build/ios/iphonesimulator/Runner.app
          if-no-files-found: warn
