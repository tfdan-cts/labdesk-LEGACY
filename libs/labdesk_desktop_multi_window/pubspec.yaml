name: labdesk_desktop_multi_window
description: Multi-window support for the LabDesk desktop application, derived from the desktop_multi_window plugin by MixinNetwork.
version: 0.1.0
homepage: https://github.com/tfdan-cts/LabDesk

environment:
  sdk: ">=2.17.0 <3.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      macos:
        pluginClass: FlutterMultiWindowPlugin
      windows:
        pluginClass: DesktopMultiWindowPlugin
      linux:
        pluginClass: DesktopMultiWindowPlugin